<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الأذكار والمذاكرة الشامل</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* --- Tabs --- */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn, .azkar-tab-btn {
            padding: 10px 20px;
            border: none;
            background-color: #e0e0e0;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active, .azkar-tab-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }

        .section-content {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .section-content.active {
            display: block;
        }

        /* --- Azkar Section --- */
        .azkar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .azkar-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .zekr-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .fadl {
            font-size: 0.85rem;
            color: #666;
            background: #f0f8ff;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .azkar-btn-group {
            display: flex;
            gap: 10px;
        }

        .counter-btn {
            flex: 1;
            padding: 8px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .counter-btn:disabled {
            background: #27ae60;
            cursor: default;
        }

        .reset-btn {
            padding: 8px 12px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        /* --- Revision & Notebooks Section --- */
        .notebooks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .notebook-card {
            border: 2px dashed var(--secondary-color);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            background: #f9fbfd;
            user-select: none;
        }

        .notebook-actions {
            margin-top: 10px;
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            background: var(--secondary-color);
            color: white;
            cursor: pointer;
        }

        .btn-download {
            background: #34495e;
        }

        .btn-add {
            background: var(--accent-color);
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: vertical;
            margin: 10px 0;
            font-size: 1rem;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        /* --- Pomodoro Section --- */
        .timer-box {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--primary-color);
        }

        .pomo-inputs-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .pomo-inputs-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: right;
        }

        th {
            background-color: #f2f2f2;
        }

        .status-completed { color: green; font-weight: bold; }
        .status-failed { color: red; font-weight: bold; }
        .btn-delete { background: none; border: none; cursor: pointer; }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 280px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>منصة المذاكرة والأذكار اليومية</h1>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchMainTab('azkar-section', this)">الأذكار والدعاء</button>
            <button class="tab-btn" onclick="switchMainTab('revision-section', this)">كشاكيل المراجعة</button>
            <button class="tab-btn" onclick="switchMainTab('pomodoro-section', this)">مؤقت البومودورو</button>
            <button class="tab-btn" onclick="switchMainTab('digital-section', this)">الدفتر الرقمي</button>
        </div>

        <div id="azkar-section" class="section-content active">
            <div class="nav-tabs">
                <button class="azkar-tab-btn active" onclick="switchAzkarCategory('maseya', this)">أذكار المساء</button>
                <button class="azkar-tab-btn" onclick="switchAzkarCategory('ad3ya', this)">أدعية المذاكرة والنجاح</button>
            </div>
            <div id="azkar-container" class="azkar-grid"></div>
        </div>

        <div id="revision-section" class="section-content">
            <button class="btn btn-add" onclick="addNewNotebook()">➕ إضافة كشكول جديد</button>
            
            <div id="notebooks-list" class="notebooks-grid"></div>

            <div id="revision-editor" style="display: none;">
                <button class="btn" onclick="closeRevisionEditor()">⬅️ العودة للقائمة</button>
                <h3 id="revision-page-num" style="margin-top: 10px;"></h3>
                
                <div class="controls-row">
                    <button class="btn" onclick="changeRevisionPage(-1)">الصفحة السابقة</button>
                    <button class="btn" onclick="changeRevisionPage(1)">الصفحة التالية</button>
                    <input type="number" id="revision-search-input" placeholder="رقم الصفحة (1-40)" min="1" max="40" style="padding: 5px; width: 140px;">
                    <button class="btn" onclick="goToRevisionPage()">انتقال</button>
                </div>

                <textarea id="revision-text" placeholder="اكتب ملاحظاتك ومراجعتك هنا..."></textarea>
                <button class="btn btn-add" onclick="saveRevisionPage()">💾 حفظ الصفحة</button>
            </div>
        </div>

        <div id="pomodoro-section" class="section-content">
            <h2>مؤقت التركيز (البومودورو)</h2>
            <div class="timer-box" id="timer-display">00:00</div>

            <div id="pomo-inputs" class="pomo-inputs-group">
                <input type="text" id="session-name" placeholder="اسم الجلسة (مثال: رياضيات)">
                <input type="number" id="session-duration" placeholder="المدة بالدقائق" value="25" min="1">
                <button class="btn btn-add" onclick="startPomodoro()">ابدأ الجلسة</button>
            </div>

            <div id="pomo-controls" style="display: none; text-align: center;">
                <button class="btn" style="background: var(--danger-color);" onclick="stopPomodoro(true)">إلغاء الجلسة</button>
            </div>

            <hr style="margin: 20px 0;">

            <h3>سجل الجلسات اليومية</h3>
            <p>الجلسات الناجحة: <span id="completed-count">0</span> | غير المكتملة: <span id="incomplete-count">0</span></p>
            <button class="btn" style="background: var(--danger-color); margin-top: 5px;" onclick="resetPomoDay()">إعادة ضبط اليوم 🔄</button>

            <table>
                <thead>
                    <tr>
                        <th>اسم الجلسة</th>
                        <th>الحالة</th>
                        <th>وقت البدء</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="sessions-table-body"></tbody>
            </table>
        </div>

        <div id="digital-section" class="section-content">
            <h2>الدفتر الرقمي الشامل (100 صفحة)</h2>
            <h4 id="digital-page-num" style="margin: 10px 0;">صفحة 1 من 100</h4>

            <div class="controls-row">
                <button class="btn" onclick="changeDigitalPage(-1)">الصفحة السابقة</button>
                <button class="btn" onclick="changeDigitalPage(1)">الصفحة التالية</button>
                <input type="number" id="digital-search-input" placeholder="رقم الصفحة (1-100)" min="1" max="100" style="padding: 5px; width: 150px;">
                <button class="btn" onclick="goToDigitalPage()">انتقال</button>
            </div>

            <textarea id="digital-text" placeholder="اكتب الملاحظات اليومية أو الأفكار هنا..."></textarea>
            <button class="btn btn-add" onclick="saveDigitalPage()">💾 حفظ الصفحة</button>
        </div>
    </div>

    <div id="notebook-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-notebook-title">خيارات الكشكول</h3>
            <br>
            <button class="btn" onclick="renameNotebookAction()">تغيير الاسم</button>
            <button class="btn" style="background: var(--danger-color);" onclick="deleteNotebookAction()">حذف الكشكول</button>
            <button class="btn" style="background: #7f8c8d; margin-top: 10px;" onclick="closeNotebookModal()">إلغاء</button>
        </div>
    </div>

    <script>
        // --- 1. Global Navigation Logic ---
        function switchMainTab(sectionId, btn) {
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            btn.classList.add('active');
        }

        // --- 2. Azkar Logic ---
        let currentAzkarCategory = 'maseya';
        const azkarDatabase = {
            maseya: [
                { text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1, fadl: "من أذكار الليل والمساء لحفظ العبد وإعطائه خير الليلة." },
                { text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.", count: 1, fadl: "من أذكار المساء المأثورة." },
                { text: "اللَّهُمَّ أنْتَ رَبِّي لا إلَهَ إلَّا أنْتَ، خَلَقْتَنِي وأنا عَبْدُكَ، وأنا علَى عَهْدِكَ ووَعْدِكَ ما اسْتَطَعْتُ، أعُوذُ بكَ مِن شَرِّ ما صَنَعْتُ، أبُوءُ لكَ بنِعْمَتِكَ عَلَيَّ، وأَبُوءُ لكَ بذَنْبِي فاغْفِرْ لِي، فإنَّه لا يَغْفِرُ الذُّنُوبَ إلَّا أنْتَ.", count: 1, fadl: "من قالها حين يمسي ومات دخل الجنة." },
                { text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", count: 3, fadl: "لم تضره حمة أو شيء في تلك الليلة." },
                { text: "قراءة سورة الإخلاص، الفلق، والناس", count: 3, fadl: "تكفيك من كل شيء في ليلتك." },
                { text: "آية الكرسي: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...)", count: 1, fadl: "من قالها حين يمسي أُجِيرَ من الجن حتى يصبح." },
                { text: "آمنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ... (خواتيم سورة البقرة)", count: 1, fadl: "من قرأهما في ليلة كفتاه." }
            ],
            ad3ya: [
                { text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي.", count: 1, fadl: "دعاء العافية الشامل." },
                { text: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.", count: 3, fadl: "دعاء إصلاح الشأن والتوكل." },
                { text: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ.", count: 1, fadl: "تفريب الهموم والغموم." },
                { text: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي.", count: 3, fadl: "دعاء بالتيسير والنجاح في الدراسية والعمل." },
                { text: "اللَّهُمَّ لا سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلاً.", count: 1, fadl: "دعاء لتسهيل الصعاب في الامتحانات والمذاكرة." }
            ]
        };

        let azkarProgress = JSON.parse(localStorage.getItem('om_azkar_progress')) || {};

        function switchAzkarCategory(cat, btn) {
            currentAzkarCategory = cat;
            document.querySelectorAll('.azkar-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAzkar();
        }

        function renderAzkar() {
            const container = document.getElementById('azkar-container');
            container.innerHTML = '';
            const list = azkarDatabase[currentAzkarCategory];

            list.forEach((item, index) => {
                const key = `${currentAzkarCategory}_${index}`;
                const savedCount = azkarProgress[key] !== undefined ? azkarProgress[key] : item.count;
                
                const card = document.createElement('div');
                card.className = 'azkar-card';
                card.innerHTML = `
                    <div class="zekr-text">${item.text}</div>
                    ${item.fadl ? `<div class="fadl">💡 ${item.fadl}</div>` : ''}
                    <div class="azkar-btn-group">
                        <button class="counter-btn" ${savedCount === 0 ? 'disabled' : ''} onclick="countZekr('${key}', ${item.count})">
                            ${savedCount > 0 ? `التكرار المتبقي: ${savedCount}` : 'تم الإنجاز ✓'}
                        </button>
                        <button class="reset-btn" onclick="resetZekr('${key}', ${item.count})">🔄</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function countZekr(key, max) {
            let current = azkarProgress[key] !== undefined ? azkarProgress[key] : max;
            if(current > 0) {
                azkarProgress[key] = current - 1;
                localStorage.setItem('om_azkar_progress', JSON.stringify(azkarProgress));
                renderAzkar();
            }
        }

        function resetZekr(key, max) {
            azkarProgress[key] = max;
            localStorage.setItem('om_azkar_progress', JSON.stringify(azkarProgress));
            renderAzkar();
        }

        // --- 3. OM Revision Logic ---
        let notebooks = JSON.parse(localStorage.getItem('om_notebooks')) || [
            { id: 1, name: "كشكول 1", pages: {} },
            { id: 2, name: "كشكول 2", pages: {} },
            { id: 3, name: "كشكول 3", pages: {} },
            { id: 4, name: "كشكول 4", pages: {} }
        ];

        let currentNotebookId = null;
        let currentRevisionPage = 1;
        let longPressTimer = null;
        let selectedNotebookId = null;

        function saveNotebooksState() {
            localStorage.setItem('om_notebooks', JSON.stringify(notebooks));
        }

        function renderNotebooks() {
            const listContainer = document.getElementById('notebooks-list');
            listContainer.innerHTML = '';

            notebooks.forEach(nb => {
                const card = document.createElement('div');
                card.className = 'notebook-card';
                card.innerHTML = `
                    <h3>📖 ${nb.name}</h3>
                    <div class="notebook-actions">
                        <button onclick="openRevisionNotebook(${nb.id})" class="btn">فتح الكشكول</button>
                        <button onclick="downloadNotebook(${nb.id})" class="btn btn-download" title="تحميل محتوى الكشكول">📥</button>
                    </div>
                `;

                // Add Long Press Support for mobile/desktop
                card.addEventListener('mousedown', () => startLongPress(nb.id));
                card.addEventListener('mouseup', cancelLongPress);
                card.addEventListener('mouseleave', cancelLongPress);
                
                card.addEventListener('touchstart', (e) => {
                    startLongPress(nb.id);
                });
                card.addEventListener('touchend', cancelLongPress);

                listContainer.appendChild(card);
            });
        }

        function startLongPress(id) {
            cancelLongPress();
            longPressTimer = setTimeout(() => {
                showNotebookModal(id);
            }, 700); // 700ms للضغط المطول
        }

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function showNotebookModal(id) {
            selectedNotebookId = id;
            const nb = notebooks.find(n => n.id === id);
            if(nb) {
                document.getElementById('modal-notebook-title').innerText = `خيارات "${nb.name}"`;
                document.getElementById('notebook-modal').style.display = 'flex';
            }
        }

        function closeNotebookModal() {
            document.getElementById('notebook-modal').style.display = 'none';
            selectedNotebookId = null;
        }

        function renameNotebookAction() {
            const nb = notebooks.find(n => n.id === selectedNotebookId);
            if (nb) {
                const newName = prompt("أدخل الاسم الجديد للكشكول:", nb.name);
                if (newName && newName.trim() !== "") {
                    nb.name = newName.trim();
                    saveNotebooksState();
                    renderNotebooks();
                }
            }
            closeNotebookModal();
        }

        function deleteNotebookAction() {
            const nbIndex = notebooks.findIndex(n => n.id === selectedNotebookId);
            if (nbIndex !== -1) {
                if (confirm(`هل أنت تأكد من حذف "${notebooks[nbIndex].name}" بما يحتويه؟`)) {
                    notebooks.splice(nbIndex, 1);
                    saveNotebooksState();
                    renderNotebooks();
                }
            }
            closeNotebookModal();
        }

        function addNewNotebook() {
            const name = prompt("أدخل اسم الكشكول الجديد:");
            if(name && name.trim() !== "") {
                const newId = Date.now();
                notebooks.push({
                    id: newId,
                    name: name.trim(),
                    pages: {}
                });
                saveNotebooksState();
                renderNotebooks();
            }
        }

        function openRevisionNotebook(id) {
            currentNotebookId = id;
            currentRevisionPage = 1;
            document.getElementById('notebooks-list').style.display = 'none';
            document.getElementById('revision-editor').style.display = 'block';
            loadRevisionPage();
        }

        function closeRevisionEditor() {
            document.getElementById('revision-editor').style.display = 'none';
            document.getElementById('notebooks-list').style.display = 'grid';
            currentNotebookId = null;
        }

        function loadRevisionPage() {
            const nb = notebooks.find(n => n.id === currentNotebookId);
            if (!nb) return;
            document.getElementById('revision-page-num').innerText = `صفحة ${currentRevisionPage} من 40 (كشكول: ${nb.name})`;
            const text = nb.pages[currentRevisionPage] || "";
            document.getElementById('revision-text').value = text;
        }

        function saveRevisionPage() {
            const nb = notebooks.find(n => n.id === currentNotebookId);
            if (!nb) return;
            const text = document.getElementById('revision-text').value;
            nb.pages[currentRevisionPage] = text;
            saveNotebooksState();
            alert(`تم حفظ الصفحة ${currentRevisionPage} بنجاح ✅`);
        }

        function changeRevisionPage(delta) {
            saveRevisionPageSilent();
            let newPage = currentRevisionPage + delta;
            if (newPage >= 1 && newPage <= 40) {
                currentRevisionPage = newPage;
                loadRevisionPage();
            }
        }

        function goToRevisionPage() {
            const input = document.getElementById('revision-search-input');
            const page = parseInt(input.value);
            if (page >= 1 && page <= 40) {
                saveRevisionPageSilent();
                currentRevisionPage = page;
                loadRevisionPage();
                input.value = '';
            }
        }

        function saveRevisionPageSilent() {
            const nb = notebooks.find(n => n.id === currentNotebookId);
            if (nb) {
                const text = document.getElementById('revision-text').value;
                nb.pages[currentRevisionPage] = text;
                saveNotebooksState();
            }
        }

        function downloadNotebook(id) {
            const nb = notebooks.find(n => n.id === id);
            if (!nb) return;

            let content = `=== ${nb.name} ===\n\n`;
            let hasContent = false;

            for (let i = 1; i <= 40; i++) {
                if (nb.pages[i] && nb.pages[i].trim() !== "") {
                    content += `--- صفحة ${i} ---\n${nb.pages[i]}\n\n`;
                    hasContent = true;
                }
            }

            if (!hasContent) {
                alert("الكشكول فارغ! لا تتوفر معلومات لتنزيلها.");
                return;
            }

            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${nb.name}.txt`;
            link.click();
        }

        // --- 4. Pomodoro Logic ---
        let pomoTimer = null;
        let pomoTimeLeft = 0;
        let currentPomoSession = null;
        let pomodoroHistory = JSON.parse(localStorage.getItem('om_pomo_history')) || [];

        function startPomodoro() {
            const nameInput = document.getElementById('session-name');
            const durationInput = document.getElementById('session-duration');
            
            const name = nameInput.value.trim() || 'جلسة مذاكرة';
            const duration = parseInt(durationInput.value);

            if(!duration || duration <= 0) {
                alert('الرجاء كتابة مدة الجلسة بالدقائق!');
                return;
            }

            pomoTimeLeft = duration * 60;
            currentPomoSession = {
                id: Date.now(),
                name: name,
                duration: duration,
                startTime: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                status: 'running'
            };

            document.getElementById('pomo-inputs').style.display = 'none';
            document.getElementById('pomo-controls').style.display = 'block';

            updateTimerDisplay();
            pomoTimer = setInterval(() => {
                pomoTimeLeft--;
                updateTimerDisplay();

                if (pomoTimeLeft <= 0) {
                    stopPomodoro(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(pomoTimeLeft / 60);
            const seconds = pomoTimeLeft % 60;
            document.getElementById('timer-display').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function stopPomodoro(manualCancelled = false) {
            clearInterval(pomoTimer);
            pomoTimer = null;

            if (currentPomoSession) {
                currentPomoSession.status = manualCancelled ? 'failed' : 'completed';
                pomodoroHistory.unshift(currentPomoSession);
                localStorage.setItem('om_pomo_history', JSON.stringify(pomodoroHistory));
                
                if(!manualCancelled) {
                    alert('🎉 تهانينا! أنجزت الجلسة بنجاح!');
                }
            }

            document.getElementById('pomo-inputs').style.display = 'flex';
            document.getElementById('pomo-controls').style.display = 'none';
            document.getElementById('timer-display').innerText = '00:00';
            currentPomoSession = null;
            renderPomoHistory();
        }

        function renderPomoHistory() {
            const tbody = document.getElementById('sessions-table-body');
            tbody.innerHTML = '';

            let completed = 0;
            let failed = 0;

            pomodoroHistory.forEach((item, idx) => {
                if(item.status === 'completed') completed++;
                if(item.status === 'failed') failed++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td class="${item.status === 'completed' ? 'status-completed' : 'status-failed'}">
                        ${item.status === 'completed' ? 'ناجحة ✓' : 'غير مكتملة ✗'}
                    </td>
                    <td>${item.startTime}</td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deletePomoSession(${idx})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('completed-count').innerText = completed;
            document.getElementById('incomplete-count').innerText = failed;
        }

        function deletePomoSession(index) {
            pomodoroHistory.splice(index, 1);
            localStorage.setItem('om_pomo_history', JSON.stringify(pomodoroHistory));
            renderPomoHistory();
        }

        function resetPomoDay() {
            if(confirm('هل تريد مسح جميع سجلات الجلسات للبدء من جديد؟')) {
                pomodoroHistory = [];
                localStorage.setItem('om_pomo_history', JSON.stringify(pomodoroHistory));
                renderPomoHistory();
            }
        }

        // --- 5. Digital Notebook Logic ---
        let currentDigitalPage = 1;
        let digitalNotebookPages = JSON.parse(localStorage.getItem('om_digital_notebook')) || {};

        function loadDigitalPage() {
            document.getElementById('digital-page-num').innerText = `صفحة ${currentDigitalPage} من 100`;
            const text = digitalNotebookPages[currentDigitalPage] || "";
            document.getElementById('digital-text').value = text;
        }

        function saveDigitalPage() {
            const text = document.getElementById('digital-text').value;
            digitalNotebookPages[currentDigitalPage] = text;
            localStorage.setItem('om_digital_notebook', JSON.stringify(digitalNotebookPages));
            alert(`تم حفظ الصفحة ${currentDigitalPage} بنجاح 💾`);
        }

        function saveDigitalPageSilent() {
            const text = document.getElementById('digital-text').value;
            digitalNotebookPages[currentDigitalPage] = text;
            localStorage.setItem('om_digital_notebook', JSON.stringify(digitalNotebookPages));
        }

        function changeDigitalPage(delta) {
            saveDigitalPageSilent();
            let newPage = currentDigitalPage + delta;
            if (newPage >= 1 && newPage <= 100) {
                currentDigitalPage = newPage;
                loadDigitalPage();
            }
        }

        function goToDigitalPage() {
            const input = document.getElementById('digital-search-input');
            const page = parseInt(input.value);
            if (page >= 1 && page <= 100) {
                saveDigitalPageSilent();
                currentDigitalPage = page;
                loadDigitalPage();
                input.value = '';
            }
        }

        // --- Initialization ---
        window.onload = function() {
            renderAzkar();
            renderNotebooks();
            renderPomoHistory();
            loadDigitalPage();
        };
    </script>
</body>
</html>
